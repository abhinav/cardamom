version: "2"

linters:
  default: none
  enable:
    # golangci-lint defaults.
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Non-default checks.
    - copyloopvar # Prefer Go 1.22 loop semantics.
    - depguard    # Keep infrastructure imports inside their owning boundaries.
    - errname     # Standardize sentinel error names.
    - errorlint   # Preserve Go error wrapping and matching semantics.
    - gocritic    # Catch general correctness and readability problems.
    - iface       # Reject private interfaces in exported signatures.
    - intrange    # Prefer range over index-only integer loops.
    - makezero    # Catch initialized-length slices that are then appended to.
    - musttag     # Require tags on serialized structs.
    - nolintlint  # Require precise and necessary lint suppressions.
    - perfsprint  # Prefer direct string conversion over formatting.
    - revive      # Enforce Go style and public API hygiene.
    - unconvert   # Remove unnecessary conversions.
    - usetesting  # Prefer testing-aware filesystem and context APIs.
    - modernize   # Prefer current standard-library constructs.
  settings:
    depguard:
      rules:
        # SQL and SQLite are repository implementation details.
        # Domain, command, protocol, and process packages consume finite
        # repository interfaces instead of persistence APIs.
        repository-implementation:
          files:
            - $all
            - '!**/internal/repository/**'
          deny:
            - pkg: database/sql
              desc: persistence implementation belongs in internal/repository
            - pkg: modernc.org/sqlite
              desc: persistence implementation belongs in internal/repository

        # Kong belongs at the executable and command parsing boundaries.
        kong-boundary:
          files:
            - $all
            - '!**/internal/process/**'
            - '!**/internal/cli/**'
          deny:
            - pkg: github.com/alecthomas/kong
              desc: Kong imports belong in internal/process or internal/cli

    govet:
      enable:
        - nilness
        - reflectvaluecompare
        - sortslice
        - unusedwrite

    iface:
      enable:
        - unexported

    usetesting:
      context-background: true
      context-todo: true

    revive:
      rules:
        # Keep the complete Revive default set explicit. Supplying any rules
        # replaces Revive's implicit defaults.
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        # Staticcheck handles empty blocks with fewer false positives.
        - name: empty-block
          disabled: true
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          # Package naming is reviewed at package-design boundaries. Revive's
          # lexical stuttering heuristic cannot distinguish established domain
          # names, so this rule enforces documentation without renaming APIs.
          arguments: [disableStutteringCheck]
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming

  exclusions:
    generated: lax
    rules:
      - linters: [musttag]
        path: _test.go$

formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
