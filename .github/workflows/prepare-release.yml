name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to prepare (e.g. v1.2.3).
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-pr:
    name: Generate release PR
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release
        id: prepare
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mise run release:prepare "$VERSION"
          latest="$(changie latest)"
          printf 'latest=%s\n' "$latest" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          branch: release/${{ steps.prepare.outputs.latest }}
          commit-message: Release ${{ steps.prepare.outputs.latest }}
          title: Release ${{ steps.prepare.outputs.latest }}
          token: ${{ secrets.PAT }}
          body: ''
