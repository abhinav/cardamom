[settings]
experimental = true

[env]
GOBIN = "{{ config_root }}/bin"
_.path = ["{{ config_root }}/bin"]

[tools]
buf = "latest"
go = "latest"
node = "latest"
pnpm = "latest"
"aqua:sqlc-dev/sqlc" = "latest"
"aqua:golangci/golangci-lint" = "latest"
"aqua:goreleaser/goreleaser" = "latest"
"aqua:miniscruff/changie" = "latest"
"github:abhinav/requiredfield" = "latest"
"github:abhinav/stitchmd" = "latest"

[tasks.generate]
description = "Generate protocol and repository code"
depends = ["generate:*"]

[tasks."generate:buf"]
description = "Generate Go and TypeScript protocol code"
run = [
  "CI=true pnpm --dir web install --frozen-lockfile",
  "buf generate",
]

[tasks."generate:mocks"]
description = "Generate Go test mocks"
run = "go generate ./..."

[tasks."generate:sqlc"]
description = "Generate repository code"
run = "sqlc generate"

[tasks."generate:skill"]
description = "Generate the embedded Cardamom skill archive"
run = "go run ./internal/skill/cmd/skillarchive"

[tasks."migration:new:sql"]
description = "Create a timestamped Goose SQL schema migration"
usage = '''
arg "<name>" help="Simple name for the migration"
'''
run = "go run ./internal/repository/store/cmd/migration sql {{usage.name|quote}}"

[tasks."migration:new:go"]
description = "Create a timestamped Goose Go data migration"
usage = '''
arg "<name>" help="Simple name for the migration"
'''
run = "go run ./internal/repository/store/cmd/migration go {{usage.name|quote}}"

[tasks.fmt]
description = "Format Go source"
run = "golangci-lint fmt"

[tasks.lint]
description = "Run all lint checks"
depends = ["lint:*"]

[tasks."lint:golangci-lint"]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks."lint:requiredfield"]
description = "Check required struct fields"
run = "go vet -vettool=$(command -v requiredfield) ./..."

[tasks."lint:tidy"]
description = "Ensure Go modules are tidy"
run = "go mod tidy -diff"

[tasks."lint:gofix"]
description = "Check for Go source fixes"
run = "go fix -diff ./..."

[tasks."lint:buf"]
description = "Lint protobuf schemas"
run = "buf lint"

[tasks."lint:sqlc"]
description = "Check generated repository code"
run = "sqlc diff"

[tasks."lint:adr-table"]
description = "Check that the architecture decision index is up to date"
run = "./tools/update-adr-table.sh --diff"

[tasks."lint:readme"]
description = "Check that README.md is up to date"
run = '''
readme_diff=$(
  stitchmd -diff \
    -o README.md \
    -preface doc/readme/preface.md \
    doc/readme/README.md
)

if [[ -n "$readme_diff" ]]; then
  printf '%s\n' "$readme_diff"
  exit 1
fi
'''

[tasks."lint:user-guide"]
description = "Check that USER_GUIDE.md is up to date"
run = '''
guide_diff=$(
  stitchmd -unsafe -diff \
    -o USER_GUIDE.md \
    -preface doc/guide/preface.md \
    doc/guide/README.md
)

if [[ -n "$guide_diff" ]]; then
  printf '%s\n' "$guide_diff"
  exit 1
fi
'''

[tasks.docs]
description = "Generate README.md and USER_GUIDE.md"
depends = ["readme", "user-guide"]

[tasks.readme]
description = "Generate README.md"
run = "stitchmd -o README.md -preface doc/readme/preface.md doc/readme/README.md"

[tasks."user-guide"]
description = "Generate USER_GUIDE.md"
run = "stitchmd -unsafe -o USER_GUIDE.md -preface doc/guide/preface.md doc/guide/README.md"

[tasks.build]
description = "Build Cardamom with embedded production assets"
depends = ["generate:skill", "web:build"]
run = '''
build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
go build \
  -tags=assets \
  -ldflags="-X go.abhg.dev/cardamom/internal/cli.BuildTime=$build_time" \
  -o bin/card \
  ./cmd/card
'''

[tasks.test]
description = "Run all tests"
usage = '''
flag "--race" default="false" help="Enable data race detection"
'''
depends = [
  { task = "test:unit", env = { CARDAMOM_TEST_RACE = "{{usage.race}}" } },
  { task = "test:script", env = { CARDAMOM_TEST_RACE = "{{usage.race}}" } },
  "test:web",
]

[tasks."test:unit"]
description = "Run Go unit tests"
usage = '''
flag "--race" default="false" env="CARDAMOM_TEST_RACE" help="Enable data race detection"
'''
run = 'go test -count=1 -race="${usage_race?}" ./...'

[tasks."test:script"]
description = "Run process-boundary test scripts"
depends = ["generate:skill", "web:build"]
usage = '''
flag "--race" default="false" env="CARDAMOM_TEST_RACE" help="Enable data race detection"
flag "--run <pattern>" default="." help="Run matching test scripts"
flag "--update" help="Update cmp golden files"
'''
run = '''
update=
if [ "${usage_update:-false}" = "true" ]; then
  update=-update
fi
go test \
  -count=1 \
  -race="${usage_race?}" \
  -tags=script,assets \
  -run "TestScript/${usage_run?}" \
  ./cmd/card \
  $update
'''

[tasks."test:web"]
description = "Run web unit tests"
run = [
  "CI=true pnpm --dir web install --frozen-lockfile",
  "pnpm --dir web test",
]

[tasks."web:build"]
description = "Build frontend assets for embedding"
run = [
  "CI=true pnpm --dir web install --frozen-lockfile",
  "pnpm --dir web build",
  "go run ./internal/web/server/cmd/webarchive -source web/dist -output internal/web/server/static.tar.gz",
]

[tasks."web:dev"]
description = "Run Cardamom with the live frontend development server"
run = [
  "CI=true pnpm --dir web install --frozen-lockfile",
  "go run -tags=webdev ./cmd/card web --dev",
]

[tasks."release:prepare"]
description = "Prepare release changelog and plugin metadata"
usage = '''
arg "<version>" help="Version or increment to prepare, such as patch, minor, or v1.2.3"
'''
run = [
  'go run ./tools/pluginrelease -check "$(changie latest)"',
  "changie batch {{usage.version|quote}}",
  "changie merge",
  'go run ./tools/pluginrelease "$(changie latest)"',
]
