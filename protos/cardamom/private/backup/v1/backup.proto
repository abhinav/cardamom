syntax = "proto3";

package cardamom.private.backup.v1;

import "google/protobuf/timestamp.proto";

// Manifest is the deterministic index written as the final member of a
// portable Cardamom backup archive.
message Manifest {
  // version selects the archive layout and manifest contract.
  // Readers accept only version 1.
  uint32 version = 1;

  // projects contains each project referenced by boards exactly once,
  // ordered by project ID.
  repeated Project projects = 2;

  // boards contains each source board exactly once,
  // ordered by source board ID.
  repeated BoardPublication boards = 3;

  // blobs contains each attachment body digest exactly once,
  // ordered by digest.
  repeated Blob blobs = 4;
}

// Project preserves source project metadata for grouping board restorations.
message Project {
  // id is an archive-scoped foreign key used by BoardPublication.project_id.
  // Restoration may assign a different destination project identity.
  string id = 1;

  string name = 2;

  // created_at is the source project's creation timestamp.
  google.protobuf.Timestamp created_at = 3;
}

// BoardPublication binds one source board view to its incremental record member
// and source project.
message BoardPublication {
  // project_id must reference one Manifest.projects entry.
  string project_id = 1;

  // source_lineage_id is the stable lineage minted by the source store.
  // Together with source_board_id and snapshot_version,
  // it identifies a restoration receipt series.
  string source_lineage_id = 2;

  // source_board_id is the board identity in the source store.
  // Restoration remaps this value to a destination board identity.
  string source_board_id = 3;

  // source_revision is the retained source view from which the snapshot was read.
  int64 source_revision = 4;

  // snapshot_version selects the semantic board-copy digest contract.
  // It must equal BoardHeader.version in the referenced member.
  // Archive format version 1 readers accept semantic version 3.
  uint32 snapshot_version = 5;

  // snapshot_digest is the SHA-256 digest of the versioned deterministic
  // semantic fields in the complete canonical BoardRecord sequence.
  // It excludes source lineage, source revision, and archive protobuf framing.
  string snapshot_digest = 6;

  // member is required and describes the encoded BoardRecord sequence.
  // Its name must be boards/id/<unpadded base64url source_board_id>.
  Member member = 7;
}

// Blob indexes one deduplicated attachment body stored in the archive.
message Blob {
  // digest is the canonical sha256:<lowercase hex> content identity.
  string digest = 1;

  // size_bytes is the uncompressed content length in bytes.
  uint64 size_bytes = 2;

  // member must be blobs/sha256/<digest hex>.
  string member = 3;
}

// Member records the uncompressed integrity facts used to verify one ZIP member.
message Member {
  // name is the canonical extensionless ZIP member path.
  string name = 1;

  // size_bytes is the uncompressed member length in bytes.
  uint64 size_bytes = 2;

  // digest is the canonical SHA-256 digest of the uncompressed member bytes.
  string digest = 3;
}

// BoardRecord is one length-delimited value in an archive format version 1
// board member.
//
// A canonical member contains one header, payload sections in field-number
// order with each section using the key order below, and one trailer.
// Deterministic protobuf framing determines Member.digest and Member.size_bytes.
// BoardPublication.snapshot_digest instead covers normalized semantic fields
// and is not embedded in this sequence.
message BoardRecord {
  oneof value {
    BoardHeader header = 1;

    // issue records are ordered by Issue.id.
    Issue issue = 2;

    // label records are ordered by Label.issue_id, then Label.value.
    Label label = 3;

    // dependency records are ordered by Dependency.issue_id,
    // then Dependency.prerequisite_id.
    Dependency dependency = 4;

    // containment records are ordered by Containment.child_id.
    Containment containment = 5;

    // external_key records are ordered by ExternalKey.key,
    // then ExternalKey.issue_id.
    ExternalKey external_key = 6;

    // log_entry records use contiguous zero-based LogEntry.order values.
    LogEntry log_entry = 7;

    // state records are ordered by State.issue_id.
    State state = 8;

    // result records are ordered by Result.issue_id.
    Result result = 9;

    // checkpoint records are ordered by Checkpoint.issue_id.
    Checkpoint checkpoint = 10;

    // attachment records are ordered by Attachment.id.
    Attachment attachment = 11;

    // pin records use contiguous zero-based Pin.order values.
    Pin pin = 12;

    BoardTrailer trailer = 13;
  }
}

// BoardHeader is the required first record in a board member.
message BoardHeader {
  // version selects the semantic board-copy contract.
  // Archive format version 1 readers accept semantic version 3.
  uint32 version = 1;

  // source_lineage_id is the stable lineage minted by the source store.
  // The semantic digest excludes this retained-view coordinate.
  string source_lineage_id = 2;

  // source_revision is the retained source view used for every record.
  // The semantic digest excludes this retained-view coordinate.
  int64 source_revision = 3;

  // board is required and identifies the source board namespace.
  Board board = 4;

  // configuration is required and contains the effective source policy.
  Configuration configuration = 5;
}

// BoardTrailer is the required final record in a board member.
//
// Counts detect a stream that ends at an intermediate record boundary without
// requiring a digest value inside the stream.
message BoardTrailer {
  uint64 issues = 1;
  uint64 labels = 2;
  uint64 dependencies = 3;
  uint64 containment = 4;
  uint64 external_keys = 5;
  uint64 log_entries = 6;
  uint64 states = 7;
  uint64 results = 8;
  uint64 checkpoints = 9;
  uint64 attachments = 10;

  uint64 pins = 11;
}

// Board preserves the source namespace and presentation restored into a new
// destination board.
message Board {
  // id is the source identity used by every board-scoped relationship.
  // Restoration maps it to a newly allocated destination board identity.
  string id = 1;

  string name = 2;

  // description preserves absence separately from an empty description.
  optional string description = 3;

  // created_at is the source board's creation timestamp.
  google.protobuf.Timestamp created_at = 4;
}

// Configuration captures the effective source values restored as destination
// board policy rather than the source store's inheritance layers.
message Configuration {
  // issue_id_prefix is prepended to IDs allocated after restoration.
  string issue_id_prefix = 1;

  // issue_id_strategy must be random or sequential.
  string issue_id_strategy = 2;

  // issue_summary_max_bytes is the UTF-8 byte admission limit for summaries.
  uint64 issue_summary_max_bytes = 3;

  // attachment_max_bytes is the attachment body admission limit in bytes.
  uint64 attachment_max_bytes = 4;
  // board_pins_max_count is the largest admitted pin collection.
  uint64 board_pins_max_count = 5;
}

// Issue preserves one source issue and the source IDs referenced by related
// records; restoration remaps those IDs consistently.
message Issue {
  // id is unique within the source board.
  string id = 1;

  string title = 2;

  // kind must be workstream, task, checkpoint, or routine.
  string kind = 3;

  // lifecycle must be open, closed, or cancelled.
  string lifecycle = 4;

  // priority is in the range 0 through 4,
  // where lower values are selected first.
  int64 priority = 5;

  google.protobuf.Timestamp created_at = 6;

  // updated_at is the latest persisted source issue change.
  google.protobuf.Timestamp updated_at = 7;

  // closed_at is present only after a terminal lifecycle transition.
  google.protobuf.Timestamp closed_at = 8;

  // waiting_reason is present while the issue awaits directed continuation.
  optional string waiting_reason = 9;

  // waiting_since records when the current directed wait began.
  google.protobuf.Timestamp waiting_since = 10;

  // summary preserves absence separately from an empty stable contract.
  optional string summary = 11;

  // details preserves absence separately from empty expanded context.
  optional string details = 12;
}

// Label preserves one inert metadata association.
message Label {
  // issue_id references Issue.id.
  string issue_id = 1;

  string value = 2;
}

// Dependency preserves one readiness edge from a dependent issue to its
// prerequisite.
message Dependency {
  // issue_id references the dependent Issue.id.
  string issue_id = 1;

  // prerequisite_id references the Issue.id that must complete first.
  string prerequisite_id = 2;
}

// Containment preserves one hierarchy edge without implying a readiness
// dependency.
message Containment {
  // child_id references the contained Issue.id.
  string child_id = 1;

  // parent_id references the containing workstream or routine Issue.id.
  string parent_id = 2;
}

// ExternalKey preserves one board-scoped producer identity association.
message ExternalKey {
  // key is unique within the source board's producer namespace.
  string key = 1;

  // issue_id references Issue.id.
  string issue_id = 2;
}

// LogEntry preserves one immutable source Log record.
message LogEntry {
  // order is the stable source board sequence used to restore chronology.
  uint64 order = 1;

  // id is the source identity referenced by State.snapshot_log_entry_id.
  string id = 2;

  // issue_id references the owning Issue.id.
  string issue_id = 3;

  // kind must be post or state_snapshot.
  string kind = 4;

  // author is absent when the source record has no attributed author.
  optional string author = 5;

  // committer is absent when the source record has no persisted committer.
  optional string committer = 6;

  // body is the durable Markdown record content.
  string body = 7;

  // created_at is absent when the source timestamp is unknown.
  google.protobuf.Timestamp created_at = 8;

  // next_action is meaningful only for state_snapshot records.
  optional string next_action = 9;
}

// State preserves one issue's mutable recovery surface at the retained source
// revision.
message State {
  // issue_id references the owning Issue.id.
  string issue_id = 1;

  // body is the current recovery truth in Markdown.
  string body = 2;

  // author is absent when the current state's author is unknown.
  optional string author = 3;

  // updated_at is absent when the latest source change time is unknown.
  google.protobuf.Timestamp updated_at = 4;

  // snapshot_log_entry_id references the committed state_snapshot LogEntry,
  // when the current state has one.
  optional string snapshot_log_entry_id = 5;

  // next_action is absent when no planned transition is recorded.
  optional string next_action = 6;
}

// Result preserves one issue's current durable outcome at the retained source
// revision.
message Result {
  // issue_id references the owning Issue.id.
  string issue_id = 1;

  // body is the durable Markdown outcome restored as the current Result.
  string body = 2;
}

// Checkpoint preserves the terminal decision for one checkpoint issue.
message Checkpoint {
  // issue_id references an Issue.id whose kind is checkpoint.
  string issue_id = 1;

  // outcome must be approved or denied.
  string outcome = 2;

  // reason is the persisted decision rationale.
  string reason = 3;

  // decided_at is the source decision timestamp.
  google.protobuf.Timestamp decided_at = 4;
}

// Attachment preserves board-scoped metadata for active and removed
// attachments; the referenced content is indexed separately by Manifest.blobs.
message Attachment {
  // id is the source identity preserved in the destination board.
  // The restoration receipt records the same value as source and destination.
  string id = 1;

  // origin_issue_id references Issue.id when the attachment originated on an issue.
  optional string origin_issue_id = 2;

  // blob identifies the immutable attachment body required for restoration.
  BlobDescriptor blob = 3;

  string filename = 4;

  // media_type is the canonical MIME media type.
  string media_type = 5;

  // lifecycle must be active or removed.
  string lifecycle = 6;

  string created_actor = 7;

  // created_at is the source attachment creation timestamp.
  google.protobuf.Timestamp created_at = 8;

  // removed_actor is present when the source removal recorded an actor.
  optional string removed_actor = 9;

  // removed_at is present for removed attachments.
  google.protobuf.Timestamp removed_at = 10;
}

// Pin preserves one position in the board's ordered pinned-issue collection.
message Pin {
  // order is the contiguous zero-based source board position.
  uint64 order = 1;

  // issue_id references the pinned Issue.id.
  string issue_id = 2;
}

// BlobDescriptor identifies immutable content referenced by attachment
// metadata.
message BlobDescriptor {
  // digest is the canonical sha256:<lowercase hex> content identity.
  string digest = 1;

  // size_bytes is the complete uncompressed content length in bytes.
  uint64 size_bytes = 2;
}
