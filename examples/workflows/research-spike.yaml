# Research spike: fan out to three independent researchers, then
# converge on a synthesis, human review, and an action-item generator.
#
# Pattern: wide fan-out / fan-in. All three researcher lanes can work
# completely in parallel; the synthesizer waits for everyone. The
# human reviews the synthesis and approves; then the planner turns it
# into actionable issues.
#
#                ┌── research-prior-art (researcher)
#   plan ───────┼── research-tech       (researcher)
#                └── research-cost      (researcher)
#                         │
#                         ▼
#                     synthesize (synthesizer-agent)
#                         │
#                         ▼
#                     review (human checkpoint)
#                         │
#                         ▼
#                     spawn-actions (planner-agent)
#
# Try:
#   cli run research-spike --var topic="event-driven ingestion"
#   cli ready                       # plan first
#   cli ready -a researcher         # after plan: three parallel items
name: research-spike
description: Fan-out research across 3 lanes → synthesize → review → action items

vars:
  topic:
    required: true

steps:
  - id: plan
    title: "Scope research for: {{topic}}"
    agent: planner-agent
    priority: 1

  - id: research-prior-art
    title: "Prior art for {{topic}}"
    agent: researcher
    needs: [plan]

  - id: research-tech
    title: "Tech feasibility for {{topic}}"
    agent: researcher
    needs: [plan]

  - id: research-cost
    title: "Cost / complexity for {{topic}}"
    agent: researcher
    needs: [plan]

  - id: synthesize
    title: "Synthesize findings on {{topic}}"
    agent: synthesizer-agent
    needs: [research-prior-art, research-tech, research-cost]

  - id: review
    type: checkpoint
    title: "Review synthesis for {{topic}}"
    wait: { manual: true }
    needs: [synthesize]

  - id: spawn-actions
    title: "Spawn action items from {{topic}} synthesis"
    agent: planner-agent
    needs: [review]
