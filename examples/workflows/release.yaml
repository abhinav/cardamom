# Linear release pipeline with three agent lanes and one human gate.
#
# Pattern: handoff. Each step belongs to a different specialist lane;
# the next step only becomes ready when the previous one closes.
# A checkpoint blocks deploy until a human approves.
#
# Try:
#   cli run release --var version=1.2.3
#   cli ready -a build-agent          # picks up the build
#   cli ready -a test-agent           # idle until build closes
#   cli claim --as ci -a build-agent
#   cli close <build-id>
#   cli ready -a test-agent           # now has work
#   …
#   cli approve <checkpoint-id>       # unblocks deploy
name: release
description: Build → test → human approval → deploy

vars:
  version:
    required: true
    pattern: '^\d+\.\d+\.\d+$'
  channel:
    default: stable

steps:
  - id: build
    title: "Build {{version}}"
    agent: build-agent
    priority: 1

  - id: test
    title: "Test {{version}} on {{channel}}"
    agent: test-agent
    needs: [build]

  - id: approve
    type: checkpoint
    title: "Approve {{version}} for {{channel}}"
    wait: { manual: true }
    needs: [test]

  - id: deploy
    title: "Deploy {{version}} to {{channel}}"
    agent: deploy-agent
    needs: [approve]
