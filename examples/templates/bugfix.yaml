name: bugfix
description: Reproduce → fix → test → review a bug end-to-end
spec: |
  ## Bug context

  Bug: {{summary}}
  Repo: {{repo}}
  Reporter: {{reporter}}

  ## Conventions

  - Every step posts a final comment summarizing the outcome.
  - The reproducing test goes in before the fix lands (so the fix
    proves the test catches the bug).
  - Open a PR for the fix; the review step links it back to this run.

vars:
  summary:
    required: true
    prompt: "One-line bug summary"
  repo:
    required: true
    prompt: "Repo (org/name)"
    pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
  reporter:
    default: "unknown"
    prompt: "Reporter (issue # or name)"

steps:
  - id: reproduce
    title: "Reproduce: {{summary}}"
    priority: 1
    description: |
      Reproduce the bug locally. Document the minimal steps in a
      comment on this issue (commands, inputs, expected vs actual).
      Acceptance: a teammate could follow the comment and see the
      same failure.

  - id: write-test
    title: "Write failing test for: {{summary}}"
    needs: [reproduce]
    description: |
      Add a test that fails today and will pass once the bug is fixed.
      Acceptance: `pnpm test` (or equivalent) reports exactly this
      new test failing, nothing else.
      On close, comment with the test file path + name.

  - id: fix
    title: "Fix: {{summary}}"
    needs: [write-test]
    description: |
      Implement the fix. The test from the previous step must now
      pass. Don't loosen the test to make it pass — fix the cause.
      Acceptance: full suite green. On close, comment with the
      commit SHA / PR URL.

  - id: review
    type: checkpoint
    title: "Code review: {{summary}}"
    wait: { manual: true }
    needs: [fix]
    description: |
      Manual code review gate. Read the fix, sanity-check the test,
      confirm no scope creep. Use `clu approve <id>` to merge-ready
      the work, or `clu checkpoint fail <id>` to send it back.

  - id: merge
    title: "Merge fix for: {{summary}}"
    needs: [review]
    description: |
      Merge the PR. Verify CI is green on main. Close the originating
      bug report ({{reporter}}) and link this clu run from the
      external tracker.
